# V2/D435i profile. This is preview/perception only, never a motion controller.
# V2 model and TF must be selected together by topo_gng_v2.launch.py.
# Capsule radii are conservative mesh bounds, not calibrated CAD collision fits.
topo_gng_node:
  ros__parameters:
    model_version: "v2"
    camera_model: "auto"
    camera_serial: ""
    # Provisional world-axis correction measured with a ruler at two target
    # ranges (0.224 m and 0.410 m): nominal URDF Z was consistently +18.5 mm.
    # Applied coherently to depth and RGB poses for environment projection;
    # it does not mark hand-eye calibration verified or unlock execution.
    # A valid hand-eye artifact supersedes this correction.
    nominal_world_z_offset_m: -0.0185
    status_topic: "/om6dof_topo_gng_v2/status"
    # Best-effort, one JSON sample per capture attempt. Includes monotonic
    # per-stage durations, RealSense/ROS timestamp provenance and drop totals.
    perception_metrics_topic: "/om6dof_topo_gng_v2/perception_metrics"
    # Sensor-POV verification overlay: YOLO boxes plus world-frame DD-GNG nodes
    # reprojected through the current TF. Kept at 2 fps to limit CPU/bandwidth.
    debug_image_topic: "/om6dof_topo_gng_v2/debug_image/compressed"
    debug_image_period_sec: 0.5
    debug_jpeg_quality: 80
    # Full, unwarped D435i color frame for the Web Monitor. This is captured
    # before color is registered into the depth coordinate system.
    rgb_image_topic: "/om6dof_topo_gng_v2/rgb/image/compressed"
    # Below the 33.3 ms sensor period so timestamp jitter never skips an
    # otherwise valid 30 fps D435i frame. The camera itself remains the cap.
    rgb_image_period_sec: 0.02
    rgb_jpeg_quality: 80
    pixel_step: 6          # matches realsense_ddgng/ddgng_realsense.py's PIXEL_STEP
    max_nodes: 500          # matches realsense_ddgng/ddgng_realsense.py's MAX_NODES
    updates: 300            # DynamicDensityGrowingNeuralGas updates per captured frame
    # Environment only: semantic-attention DD-GNG; reachability below stays ordinary GNG.
    environment_graph_method: "dd_gng"
    ddgng_attention_sample_fraction: 0.5  # at least half the draws remain whole-cloud
    ddgng_attention_radius_m: 0.05
    ddgng_max_strength: 3.0
    semantic_max_source_age_sec: 1.0     # from source image host receipt, not completion
    semantic_max_camera_translation_m: 0.02
    semantic_max_camera_rotation_rad: 0.10
    z_min: 0.2               # metres; matches ddgng_realsense.py's Z_MIN
    z_max: 4.0               # metres; matches ddgng_realsense.py's Z_MAX
    width: 640
    height: 480
    fps: 30
    world_frame: "world"
    camera_frame: "auto"
    environment_graph_topic: "/om6dof_topo_gng_v2/environment_graph"
    environment_graph_data_topic: "/om6dof_topo_gng_v2/environment_graph_data"
    tf_timeout_sec: 0.1
    node_marker_scale: 0.02
    edge_marker_width: 0.004

    # YOLOX (OpenCV DNN, ONNX Runtime is unavailable on this Jetson) -- same
    # model and pre/post-processing as om6dof_perception/yolox_detector.py.
    yolo_model_path: "~/.cache/om6dof_perception/yolox_s.onnx"
    yolo_backend: "tensorrt"
    yolo_engine_path: "~/.cache/om6dof_perception/yolox_s_fp16.engine"
    yolo_confidence: 0.35
    yolo_nms_threshold: 0.5
    yolo_period_sec: 0.1     # TensorRT result arrives before the three-callback label hold expires
    target_classes: ""       # attention/planning target; empty = every detected COCO class
    # GUI command: one COCO class (e.g. "bottle") or "all". YOLO overlay and
    # semantic graph coloring always retain every detection; this selection
    # only gates DD-GNG attention and reachability targets.
    target_classes_topic: "/om6dof_topo_gng_v2/set_target_classes"
    label_confidence: 0.35   # per-detection score floor before it can label any node
    min_label_nodes: 3       # a box needs >=3 supporting nodes to label anything
    # Complete only gaps inside one unambiguous labelled 3D DD-GNG component.
    # This never changes the collision point cloud or semantic attention.
    semantic_cluster_inherit_enabled: true
    semantic_cluster_inherit_max_edge_m: 0.055
    semantic_cluster_inherit_min_neighbours: 2
    semantic_cluster_inherit_min_confidence: 0.15
    labels_topic: "/om6dof_topo_gng_v2/labels"
    # One direct, depth-supported DD-GNG cluster for each accepted YOLO box.
    # Each JSON entry has its 3D centroid and stable DD-GNG node IDs.
    object_clusters_topic: "/om6dof_topo_gng_v2/object_clusters"
    object_clusters_marker_topic: "/om6dof_topo_gng_v2/object_clusters_markers"
    # Stable semantic object identity is independent of the DD-GNG node IDs,
    # which legitimately change while the online graph learns. The raw
    # centroid remains published; tracked_centroid is an EMA used only to
    # prove object continuity across planning snapshots.
    object_track_max_distance_m: 0.08
    object_track_smoothing_alpha: 0.35
    object_track_hold_frames: 30

    # Current-body graph used only for the camera self-mask. This is distinct
    # from reachability_graph_node's end-effector action roadmap below.
    robot_graph_topic: "/om6dof_topo_gng_v2/robot_graph"
    body_segment_spacing: 0.05
    body_mask_margin: 0.01
    body_radius.link1: 0.020
    body_radius.link2: 0.021
    body_radius.link3: 0.045
    body_radius.link4: 0.045
    body_radius.link5: 0.021
    body_radius.link6: 0.016
    body_radius.link7: 0.040
    body_radius.end_effector_link: 0.015
    body_radius.gripper_left_link: 0.029
    body_radius.gripper_right_link: 0.029
    body_radius.d405_payload_link: 0.060

reachability_graph_node:
  ros__parameters:
    group_name: "arm"
    end_effector_link: "end_effector_link"
    world_frame: "world"

    # Research switch: halton_prm is the controlled baseline, gng is pure
    # adaptive quantization, and guarded_gng reserves part of the same node
    # budget for evenly spaced raw samples to retain rare IK branches.
    # All backends share the same validated k-NN roadmap connection stage.
    graph_method: "gng"       # "gng", "guarded_gng", or "halton_prm"
    sample_count: 500
    max_sampling_attempts: 20000
    halton_start_index: 17
    sample_stream_seed: 0       # 0=legacy; >0=digit-permuted Halton stream
    gng_training_samples: 4000
    gng_max_epochs: 4
    gng_insert_interval: 20
    gng_max_edge_age: 50
    gng_winner_learning_rate: 0.05
    gng_neighbor_learning_rate: 0.0006
    gng_error_reduction: 0.5
    gng_error_decay: 0.995
    gng_guard_fraction: 0.25   # used only by guarded_gng; ablate before fixing
    gng_debug_publish_training_samples: true  # true = publish the raw pre-GNG Halton stream
    neighbors: 10
    max_normalized_joint_distance: 0.75
    max_cartesian_edge_length: 0.14
    edge_validation_step: 0.15

    # Ignores the SRDF's broad "Never" collision exemptions and permits only
    # directly adjacent link pairs. Disable only for diagnosis if the robot's
    # collision meshes are found to overlap incorrectly.
    strict_self_collision: true

    # Environment nodes/edges are tested against cached capsules for link2
    # through link7, the end effector, both fingers, and the D435 payload (legacy link name) at
    # every interpolated edge state. Edge 0 (fixed-base link1-link2) is omitted
    # so the known support surface does not invalidate the complete roadmap.
    target_intersection_radius: 0.05
    # A graph goal is a pre-grasp pose, never a node inside the object. The
    # physical forward direction of this gripper is +X in end_effector_link.
    # The entire object remains in the FCL collision scene.
    pregrasp_filter_enabled: true
    pregrasp_tool_approach_axis: [1.0, 0.0, 0.0]
    pregrasp_min_standoff_m: 0.07
    pregrasp_max_standoff_m: 0.13
    pregrasp_min_alignment: 0.70
    obstacle_clearance: 0.035
    target_exclusion_radius: 0.055
    body_collision_step: 0.08
    body_collision_first_edge: 1
    body_radius.link1: 0.020
    body_radius.link2: 0.021
    body_radius.link3: 0.045
    body_radius.link4: 0.045
    body_radius.link5: 0.021
    body_radius.link6: 0.016
    body_radius.link7: 0.040
    body_radius.end_effector_link: 0.015
    body_radius.gripper_left_link: 0.029
    body_radius.gripper_right_link: 0.029
    body_radius.d405_payload_link: 0.060

    # Stage 2: only the shortlisted capsule-safe route is checked against
    # exact robot collision meshes in a MoveIt/FCL PlanningScene. DD-GNG
    # nodes become spheres and DD-GNG edges become cylinders. A failed graph
    # edge is disabled and Dijkstra is repeated up to exact_max_replans.
    exact_collision_enabled: true
    # Moving to a target does not authorize contact: FCL includes target nodes,
    # target edges and nearby geometry that the legacy pickup scene excluded.
    include_target_in_collision: true
    # Bounded local joint-space sampling adds collision-checked roadmap nodes
    # only when the existing graph cannot reach the selected target.
    target_refinement_enabled: true
    exact_collision_step: 0.05
    exact_environment_point_radius: 0.012
    exact_environment_edge_radius: 0.006
    exact_max_replans: 20
    exact_environment_ignored_links: ["link1"]
    start_connect_candidates: 20
    start_max_normalized_joint_distance: 0.85
    preview_joint_velocity: 0.35
    # Compress sparse roadmap zig-zags only when the direct joint-space
    # interpolation passes the same capsule and exact FCL checks.
    path_shortcut_enabled: true
    planning_period_sec: 0.5

    node_marker_scale: 0.012
    edge_marker_width: 0.002
    path_marker_width: 0.008

    query_mode: false           # true only in isolated, preview-only benchmarks
    environment_graph_topic: "/om6dof_topo_gng_v2/environment_graph_data"
    query_topic: "/om6dof_topo_gng_v2/reachability_query"
    joint_state_topic: "/joint_states"
    graph_data_topic: "/om6dof_topo_gng_v2/reachability_graph_data"
    training_samples_topic: "/om6dof_topo_gng_v2/reachability_training_samples"
    training_samples_cloud_topic: "/om6dof_topo_gng_v2/reachability_training_samples_cloud"
    marker_topic: "/om6dof_topo_gng_v2/reachability_graph"
    plan_topic: "/om6dof_topo_gng_v2/reachability_plan"
    path_topic: "/om6dof_topo_gng_v2/reachability_path"
    rebuild_service: "/om6dof_topo_gng_v2/rebuild_reachability"
    plan_service: "/om6dof_topo_gng_v2/plan_reachability"
    scene_validation_service: "/om6dof_topo_gng_v2/validate_reachability_scene"
