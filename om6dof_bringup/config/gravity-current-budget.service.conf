# Temporary experimental profile. Install ONLY under /run/systemd/system/
# om6dof-hardware.service.d/ with the arm physically supported.
# Uses the tested isolated build; leaves the normal installed libraries intact.
# The web input adapter is required for fresh input-source acknowledgements.
# It does not automatically request READY or send a target; admittance stays off.
[Service]
ExecStart=
ExecStart=/bin/bash -c 'set -e; source /opt/ros/humble/setup.bash; source /home/kublab/ros2_ws/install/setup.bash; source /home/kublab/unitree_ros2/cyclonedds_ws/install/setup.bash; source /home/kublab/ros2_ws/install_supported_pose/local_setup.bash; unset CYCLONEDDS_URI; exec ros2 launch om6dof_teleop full_stack.launch.py current_control:=false gravity_current_budget:=true start_go2w_teleop:=true input_source:=web'
Restart=no
