# Number of consecutive failed U2D2/Dynamixel read attempts that stops the
# complete OM6DOF stack. A successful read resets the counter to zero.
consecutive_failure_shutdown_threshold: 10

# Time allowed for one requested status response. Successful reads return
# immediately; a missing single-responder packet may wait up to this bound.
read_packet_timeout_ms: 30.0

# Multi-ID SyncRead responses intermittently corrupt on this physical bus even
# with torque off, while 70,000 guarded one-ID GroupSyncRead transactions were
# clean. Keep the driver's generic default backward-compatible, but use one
# persistent single-responder handler per actuator on OM6DOF.
read_transport_mode: sequential_single_sync
