# Optical depth is backprojected and transformed through TF before map updates.
# Sizes and distances are metres. No world axis is mirrored.
/om6dof_f_gng/realsense_depth:
  ros__parameters:
    fps: 15
    stride: 2
    min_depth: 0.15
    max_depth: 3.0
    serial: ""
    camera_frame: d435_depth_optical_frame
    depth_filter: supported

/om6dof_f_gng/f_gng:
  ros__parameters:
    world_frame: world
    camera_frame: d435_depth_optical_frame
    min_depth: 0.15
    max_depth: 3.0
    max_nodes: 768
    memory_capacity: 16000
    replay_budget: 4000
    input_budget: 12000
    voxel_size: 0.01
    edge_support_radius: 0.05
    epochs_per_frame: 1
    tf_timeout: 0.5
    max_pose_age: 0.5
    require_joint_states: true
    focus_mode: auto
    gaze_u: 0.5
    gaze_v: 0.5
    focus_distance: 1.0
    world_target_x: 0.0
    world_target_y: 0.0
    world_target_z: 0.0
