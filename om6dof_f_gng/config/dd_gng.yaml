# Native DD-GNG learns only after depth has been converted to XYZ in world.
# Shared world-memory sampling is supplied by this package. The paper's
# dynamic-density sampling uses the validated focus field as its current
# suspected-region source; a semantic obstacle detector can replace it later.
# Surface-support filtering defaults to disabled so RViz displays the native graph.
# All lengths are metres; no world axis is mirrored.
/om6dof_f_gng/realsense_depth:
  ros__parameters:
    fps: 15
    stride: 2
    min_depth: 0.15
    max_depth: 3.0
    serial: ""
    camera_frame: d435_depth_optical_frame
    depth_filter: supported

/om6dof_f_gng/dd_gng:
  ros__parameters:
    algorithm: ddgng
    world_frame: world
    camera_frame: d435_depth_optical_frame
    min_depth: 0.15
    max_depth: 3.0
    # Compatibility profile for om6dof_dd_gng/DepthSensor_Buggy (layer 0).
    # Its primary online pass uses ramda=500, e1=0.0075, e2=e1/100,
    # MAX_AGE=88, GNGN=500, 0.5 node-error split, and K=100000.
    # The old program also has separate coarse/fine passes; the present
    # DD-GNG core has one pass, so dd_updates/eta1/eta2 represent its primary
    # pass.  mu is native DD-GNG attention weighting and has no old-GNG peer.
    max_nodes: 500
    memory_mode: world
    memory_capacity: 16000
    replay_budget: 4000
    input_budget: 12000
    voxel_size: 0.01
    edge_support_radius: 0.0
    epochs_per_frame: 1
    dd_updates: 500
    ddgng_kappa: 88
    ddgng_eta1: 0.0075
    ddgng_eta2: 0.000075
    ddgng_alpha: 0.5
    # DepthSensor_Buggy decays error and utility by 0.001 each update.
    ddgng_beta: 0.001
    ddgng_chi: 0.001
    ddgng_mu: 0.5
    ddgng_k: 100000.0
    tf_timeout: 0.5
    max_pose_age: 0.5
    require_joint_states: true
