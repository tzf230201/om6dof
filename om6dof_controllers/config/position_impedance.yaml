/**:
  controller_manager:
    ros__parameters:
      om6dof_position_impedance_controller:
        type: om6dof_controllers/PositionImpedanceController
  om6dof_position_impedance_controller:
    ros__parameters:
      joints: [joint1, joint2, joint3, joint4, joint5, joint6]
      update_rate: 100
      # Experimental commissioning gate. Load inactive; no automatic activation.
      # Change only after supported-arm review of model, limits and hardware mode.
      enable_on_activation: false
      allow_mock_hardware: false
      require_bus_health: true
      health_topic: /dynamixel_hardware_interface/health
      health_timeout: 0.15
      health_clean_window: 1.0
      command_timeout: 0.25
      max_update_period: 0.05
      ramp_seconds: 1.0
      joint_limit_margin: 0.05  # rad inside each URDF limit
      base_link: link1
      tip_link: end_effector_link
      gravity: [0.0, 0.0, -9.80665]
      # Same nominal motor conversion and absolute raw-current caps as teaching.
      # NOT a measured torque calibration or a certified contact-force bound.
      effort_scale: [208.541119, 208.541119, 208.541119, 285.006196, 208.541119, 285.006196]
      max_effort: [30.0, 360.0, 260.0, 30.0, 220.0, 30.0]
      # Provisional low-authority gains, not hardware-tuned. Nm/rad, Nm.s/rad.
      stiffness: [0.4, 1.0, 0.8, 0.25, 0.5, 0.2]
      damping: [0.08, 0.20, 0.16, 0.05, 0.10, 0.04]
      # Nm: min(base + ratio*abs(g(q)), extra_max, absolute_limit-abs(g(q))).
      extra_torque_base: [0.015, 0.04, 0.03, 0.01, 0.02, 0.01]
      extra_torque_ratio: [0.10]
      extra_torque_max: [0.04, 0.12, 0.10, 0.025, 0.06, 0.025]
      reference_velocity: [0.08]  # rad/s, not a physical velocity guarantee
      max_velocity: [0.30]       # measured velocity trip, also <= URDF limit
      max_reference_error: [0.10]  # rad, prevents reference windup on obstruction
      residual_torque_rate: [0.20]  # Nm/s; shrinking budgets override slew
      # Mechanical friction comes ONLY from URDF when enabled, and consumes
      # the SAME residual budget. Off initially to keep artificial damping.
      friction_compensation: false
      friction_deadzone: 0.05
      # Reviewed operator profile. Frame is the URDF/KDL base frame;
      # [Fx,Fy,Fz,Mx,My,Mz] in N,N,N,Nm,Nm,Nm.
      enable_cartesian_wrench: true
      max_cartesian_wrench: [4.0, 4.0, 4.0, 0.2, 0.2, 0.2]
